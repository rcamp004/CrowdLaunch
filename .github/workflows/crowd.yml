name: Refresh crowd forecasts
on:
  issues:
    types: [opened, edited, deleted, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  issues: read
concurrency:
  group: crowd-forecast-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate and aggregate public forecasts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CROWD_REPOSITORY: ${{ github.repository }}
        run: python scripts/crowd.py --repository "$CROWD_REPOSITORY"
      - name: Save crowd snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/crowd.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated crowd forecasts'
            git push
          fi
